name: Release

# electron-builder's recommended GitHub Releases workflow:
# 1. Draft a release in GitHub whose tag is "v<package.json version>" (e.g. v0.2.0). The title is free.
# 2. Every push to main rebuilds the installers and replaces the assets on that draft.
# 3. When the draft is ready, publish it in GitHub; GitHub then tags the latest commit.
# The draft must exist before this runs: if it does not, three parallel electron-builder runners
# would each try to create it and the non-atomic "find or create" races into duplicate drafts.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check-draft:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Require an existing draft release for the package version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if ! gh release view "$TAG" --json isDraft --jq '.isDraft' | grep -qx true; then
            echo "::error::No draft release with tag $TAG found. Create it in GitHub Releases first."
            exit 1
          fi

  package:
    needs: check-draft
    strategy:
      fail-fast: false
      # TEMPORARY: Windows-only while bringing up releases on the DaBorsten fork. Restore
      # [ubuntu-latest, windows-latest, macos-latest] once mac/linux builds are needed again.
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
